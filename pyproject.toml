[project]
name = "fit-krasnal"
version = "0.1.0"
description = "Fit Krasnal — bilans energetyczny wspierający odchudzanie (Garmin + szacowanie kcal ze zdjęć)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "garminconnect>=0.3.10",
    "anthropic>=0.60",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
